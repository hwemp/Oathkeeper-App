<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#181420"><link rel="icon" type="image/webp" href="art/arcane-chronicle.webp"><link rel="manifest" href="manifest.json"><title>Oathkeeper • Character Manager</title><style>
:root{color-scheme:dark;--bg:#131119;--card:#211d2b;--line:#3b3349;--gold:#e3c184;--muted:#aaa1b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f0fa;font:16px system-ui,sans-serif}header{padding:24px max(20px,calc((100vw - 1150px)/2));border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}h1,h2,h3{font-family:Georgia,serif;font-weight:normal}h1{margin:5px 0;font-size:32px}h2{margin-top:0;font-size:25px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}.sub,small{color:var(--muted)}main{max-width:1190px;margin:auto;padding:24px 20px 70px}nav{display:flex;gap:8px;overflow:auto;margin-bottom:24px}button,.button{background:#30283f;color:#f5f0fa;border:1px solid #51435f;border-radius:9px;padding:11px 15px;cursor:pointer;font:inherit}button:hover{border-color:var(--gold)}button.active,button.primary{background:var(--gold);color:#241b15;border-color:var(--gold)}button:disabled{opacity:.4;cursor:not-allowed}input,textarea,select{background:#17131f;color:#f5f0fa;border:1px solid #51465e;border-radius:7px;padding:10px;font:inherit;max-width:100%}input[type=number]{width:88px}input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold)}label{display:flex;gap:10px;align-items:center;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}.wide{grid-column:span 2}.full{grid-column:1/-1}.big{font:38px Georgia;color:var(--gold);margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.statgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.ability{text-align:center;background:#17131e;padding:12px 4px;border-radius:10px}.ability input{width:64px;text-align:center}.ability strong{display:block;font:28px Georgia;color:var(--gold);padding-top:10px}.pill{display:inline-block;border-radius:20p body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}button,input,select{min-height:44px}header{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}a{color:var(--gold)}

.equipment-table,.equipment-table tbody{display:block;width:100%}
.equipment-table thead{display:none}
.equipment-table tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.equipment-table td{display:block;min-width:0;padding:0;border:0}
.equipment-table td:first-child{grid-column:1/-1}
.equipment-table td[data-label]::before{content:attr(data-label);display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.equipment-table td input[type=number]{width:100%;min-width:0}
.equipment-table td:last-child{align-self:end}
.equipment-name{display:block;width:100%;min-height:46px;line-height:1.5;resize:none;overflow:hidden;overflow-wrap:anywhere;white-space:pre-wrap}

.header-title{flex:1;min-width:0}header{position:relative}.app-menu{align-self:flex-start;position:relative;flex-shrink:0;z-index:5}.app-menu summary{list-style:none;cursor:pointer;border:1px solid #51435f;border-radius:9px;padding:8px 12px;min-width:44px;min-height:44px;font-size:24px}.app-menu summary::-webkit-details-marker{display:none}.menu-options{position:absolute;top:100%;left:0;margin-top:8px;width:min(250px,calc(100vw - 40px));padding:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 28px #0008}.menu-options button{display:block;width:100%;text-align:left;border:0;background:transparent}.menu-options button:hover,.menu-options button:focus-visible{background:#30283f}.journal-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}.app-menu summary:focus-visible{outline:2px solid var(--gold);outline-offset:3px}@media(max-width:450px){header{flex-wrap:wrap}#saveState{margin-left:auto;font-size:11px}}
.equipment-title{white-space:pre-wrap;overflow-wrap:anywhere;font-size:18px;color:var(--gold)}.equipment-readonly tr{grid-template-columns:repeat(3,minmax(0,1fr))}#equipmentEditor .row{margin-top:16px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(#0b102333,#0b102366),url("/art/moonlit-citadel.webp") center top/cover no-repeat;pointer-events:none}
body{isolation:isolate;background:#0b1023}header{background:#0b10235c}main{min-height:80vh}.card{background:#171b30e8;border-color:#8274a455;box-shadow:0 8px 28px #0003}.brand-icon{width:64px;height:64px;object-fit:cover;border:1px solid #b99455;border-radius:14px;flex-shrink:0}.header-title .eyebrow{letter-spacing:2px}.menu-options,dialog{background:#171b30}nav{padding:8px 0}footer{background:#0b1023dd;padding:12px;border-radius:9px}@media(max-width:750px){.brand-icon{width:48px;height:48px}header{gap:10px}.header-title .eyebrow{font-size:9px;letter-spacing:1px}}@media(prefers-reduced-transparency:reduce){.card,header{background:#171b30}}
.menu-options{max-height:75dvh;overflow-y:auto}.menu-options .account-menu-button{margin-top:6px;border-top:1px solid #6b3545;background:#8f2037;color:#fff;font-weight:600}.menu-options .account-menu-button:hover,.menu-options .account-menu-button:focus-visible{background:#b32945}.settings-links{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.fantasy-bell{filter:drop-shadow(0 0 4px #e8b74c66)}.notification-bell{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;color:var(--gold)}.menu-options .notification-bell{display:flex;width:auto;margin-left:auto}header>.notification-bell{flex-shrink:0}
