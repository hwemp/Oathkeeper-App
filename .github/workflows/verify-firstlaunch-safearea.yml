name: Oathkeeper Actual APK First-Launch Safe-Area QA — NO APK PUBLISH
on:
  push:
    branches: [OATHKEEPER-VISUAL-WORKBENCH]
    paths: ['.github/workflows/verify-firstlaunch-safearea.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firstlaunch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Oathkeeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Oathkeeper/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect original TEST174 installed web files without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/oath-174-qa
          gh run download 43375748325 --repo "${{ github.repository }}" \
            --name Oathkeeper-TEST-BRANCH-174 --dir /tmp/oath-174-qa
          python - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          apk=Path('/tmp/oath-174-qa/Oathkeeper-TEST-BRANCH-174.apk')
          dest=Path('dist')
          dest.mkdir(exist_ok=True)
          with zipfile.ZipFile(apk) as archive:
              for info in archive.infolist():
                  if not info.filename.startswith('assets/public/'):continue
                  rel=Path(info.filename).relative_to('assets/public')
                  if '..' in rel.parts or rel.is_absolute():raise RuntimeError('Unsafe APK path')
                  if not rel.parts:continue
                  target=dest/rel
                  if info.is_dir():target.mkdir(parents=True,exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      with archive.open(info) as src,target.open('wb') as out:shutil.copyfileobj(src,out)
          assert (dest/'index.html').is_file() and (dest/'assets/main-FCw4hQ90.js').is_file()
          print('Extracted actual signed TEST174 web runtime for focused modal QA')
          PY
          # Test the REVISED stylesheet against the actual signed Test174 runtime.
          # The original Test174 APK already carries the old CSS; replace only
          # the extracted CSS file, never mutate a signed artifact.
          cp web/workbench-firstlaunch-safe-area.css dist/workbench-firstlaunch-safe-area.css
          grep -Fq 'workbench-firstlaunch-safe-area.css' dist/index.html
      - name: Run actual 360/393/412 phone safe-area acceptance
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/audit-workbench-firstlaunch-safe-area.cjs
      - name: Upload inspected modal screenshots and measurement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OATHKEEPER-FIRSTLAUNCH-SAFEAREA-REVIEW-NO-APK
          path: Oathkeeper/preview-output/*
          retention-days: 14
          if-no-files-found: warn
