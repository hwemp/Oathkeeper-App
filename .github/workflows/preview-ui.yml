name: Render approved UI preview
on:
  push:
    branches: [main, fix-approved-preview, consolidated-work, reference-safety-update]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Oathkeeper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Oathkeeper/package-lock.json
      - run: npm ci
      - run: npm run check && npm run typecheck && npm test && node scripts/verify-dice.mjs && npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/preview.cjs
      - run: node scripts/preview-store.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: actual-app-preview
          path: Oathkeeper/preview-output/*
          if-no-files-found: error
