name: Generate and commit approved free icon art
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Oathkeeper/scripts/generate-free-icons.py'
      - 'Oathkeeper/web/store-icon-catalog.js'
      - 'Oathkeeper/web/public/art/store-icons/*.webp'
      - '.github/workflows/generate-free-icons.yml'
permissions:
  contents: write
concurrency:
  group: icon-assets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Synchronize native icons from the approved WebP images
        run: python Oathkeeper/scripts/generate-free-icons.py
      - name: Commit matching Android and iOS icons
        if: github.ref_name == 'main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A Oathkeeper/web/public/art/store-icons/ Oathkeeper/android/app/src/main/res/mipmap-nodpi/ Oathkeeper/android/app/src/main/res/mipmap-anydpi-v26/ Oathkeeper/ios/App/App/Assets.xcassets/
          if ! git diff --cached --quiet; then
            git commit -m 'Sync approved fantasy icon art to native launchers [skip ci]'
            git push origin HEAD:main
          fi
