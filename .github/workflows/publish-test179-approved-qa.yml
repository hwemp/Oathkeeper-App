name: Publish verified Oathkeeper Test 179 QA APK
on:
  push:
    branches: [OATHKEEPER-VISUAL-WORKBENCH]
    paths: [.github/workflows/publish-test179-approved-qa.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-test179:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - name: Require complete successful Test 179 Android 15 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 140); do
            status=$(gh run view 43466045603 --repo "$GITHUB_REPOSITORY" --json status --jq '.status')
            conclusion=$(gh run view 43466045603 --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" != "success" ]]; then
                echo "Test 179 did not pass final Android evidence: $conclusion"
                exit 1
              fi
              echo "Test 179 completed successfully including Android device evidence."
              exit 0
            fi
            echo "QA not yet finished; not publishing without verified result (check $attempt)"
            sleep 15
          done
          echo 'QA timeout; release withheld'
          exit 1

      - name: Download the exact 179 Android APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download 43466045603 --repo "$GITHUB_REPOSITORY" \
            -n Oathkeeper-TEST-BRANCH-179 -D release
          test -s release/Oathkeeper-TEST-BRANCH-179.apk
          test -s release/SHA256SUMS.txt

      - name: Ensure the published file is the exact QA-tested APK
        run: |
          set -euo pipefail
          cd release
          printf '%s\n' 'ffbab24739cdf9cf72370d6f605b3554d4c9af5facbb52883dbda0f45c392db1  Oathkeeper-TEST-BRANCH-179.apk' | sha256sum --check -
          grep -Fx 'ffbab24739cdf9cf72370d6f605b3554d4c9af5facbb52883dbda0f45c392db1  Oathkeeper-TEST-BRANCH-179.apk' SHA256SUMS.txt

      - name: Publish Test 179 QA GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=oathkeeper-test-179-qa
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing Test179 prerelease preserved; no unverified replacement.'
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target 38da33f9aaf6c10b5b815b9947b399b80b735fea \
            --prerelease \
            --title "Oathkeeper Test 179 — Four-Issue QA APK" \
            --notes "Test 179 debug-only Android test build based on owner-approved 178. New framed bundle dice images; Android/Store icon fit; repaired crop composition of ten original 508x360 background scenes; illustrated gameplay die results correctly displayed on their settled front face. All 10 Store animated dice set assets retained. No billing activation or app store production approval. The original background source files are 508x360; enlarging them does not create genuine high-definition scene details. APK SHA-256: ffbab24739cdf9cf72370d6f605b3554d4c9af5facbb52883dbda0f45c392db1. This is a test pending owner visual acceptance; 178 remains approved baseline." \
            release/Oathkeeper-TEST-BRANCH-179.apk release/SHA256SUMS.txt
