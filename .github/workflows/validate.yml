name: Validate Oathkeeper changes
on:
  pull_request:
    paths: ['Oathkeeper/**', '.github/workflows/validate.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Oathkeeper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Oathkeeper/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow && python scripts/generate-free-icons.py
      - run: npm ci
      - run: npm run check && npm run typecheck && npm test && npm run build
