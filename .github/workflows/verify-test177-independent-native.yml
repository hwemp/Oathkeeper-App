name: Oathkeeper Test 177 Independent Native Device Check — no APK rebuild
on:
  push:
    branches: [TEST-177-DEVICE-VERIFY]
    paths:
      - '.github/workflows/verify-test177-independent-native.yml'
      - 'Oathkeeper/scripts/verify-visible-android-apk.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download REAL signed Test 177 build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/test177" "$GITHUB_WORKSPACE/native-report"
          gh run download 43436563772 --repo "${{ github.repository }}" \
            --name Oathkeeper-TEST-BRANCH-177 --dir "$RUNNER_TEMP/test177"
          (cd "$RUNNER_TEMP/test177" && sha256sum -c SHA256SUMS.txt)
          test -s "$RUNNER_TEMP/test177/Oathkeeper-TEST-BRANCH-177.apk"
      - name: Enable KVM emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install image inspection dependency for non-black WebView verification
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Launch APK and REQUIRE visible content at native resolution
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 768M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash Oathkeeper/scripts/verify-visible-android-apk.sh "$RUNNER_TEMP/test177/Oathkeeper-TEST-BRANCH-177.apk" "com.harrisonwaters.oathkeeper.test177" "$GITHUB_WORKSPACE/native-report"
      - name: Preserve device screenshots and failure diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OATHKEEPER-TEST177-VISIBLE-ANDROID-EVIDENCE
          path: native-report/*
          if-no-files-found: warn
          retention-days: 14
