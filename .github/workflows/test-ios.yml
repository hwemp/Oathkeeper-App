name: Validate iOS alternate icon build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-ios.yml'
      - 'Oathkeeper/ios/**'
      - 'Oathkeeper/web/**'
      - 'Oathkeeper/scripts/generate-free-icons.py'
permissions:
  contents: read
jobs:
  simulator-build:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Oathkeeper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Oathkeeper/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate native alternative icon images
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate-free-icons.py
      - name: Install and build Capacitor web app
        run: |
          npm ci
          npm test
          npm run catalog
          npm run build
          npx cap sync ios
      - name: Compile iOS app for simulator without signing
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
