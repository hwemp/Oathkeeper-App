name: Oathkeeper Test 179 Independent Android 15 Verification - same APK
on:
  push:
    branches: [TEST-179-DEVICE-VERIFY]
    paths:
      - '.github/workflows/verify-test179-independent-native.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download exact previously signed and browser-tested Test 179 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test179" "$GITHUB_WORKSPACE/native-report"
          gh run download 43466045603 --repo "$GITHUB_REPOSITORY" \
             --name Oathkeeper-TEST-BRANCH-179 --dir "$RUNNER_TEMP/test179"
          (cd "$RUNNER_TEMP/test179" && sha256sum -c SHA256SUMS.txt)
          printf '%s\n' 'ffbab24739cdf9cf72370d6f605b3554d4c9af5facbb52883dbda0f45c392db1  Oathkeeper-TEST-BRANCH-179.apk' | (cd "$RUNNER_TEMP/test179" && sha256sum --check -)
          test -s "$RUNNER_TEMP/test179/Oathkeeper-TEST-BRANCH-179.apk"

      - name: Enable KVM emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install image verification dependency
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Verify EXACT Test 179 signed APK on a freshly booted Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 768M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            # First run failed with "Process system isn't responding" on
            # Android HOME, so allow the independent emulator to stabilize.
            adb wait-for-device
            timeout 160 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 3; done'
            sleep 35
            bash Oathkeeper/scripts/verify-visible-android-apk.sh \
              "$RUNNER_TEMP/test179/Oathkeeper-TEST-BRANCH-179.apk" \
              "com.harrisonwaters.oathkeeper.test179" "$GITHUB_WORKSPACE/native-report"

      - name: Upload independent emulator screenshot and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OATHKEEPER-TEST179-INDEPENDENT-ANDROID-EVIDENCE
          path: native-report/*
          if-no-files-found: warn
          retention-days: 14
