name: Oathkeeper Workbench Button Text Audit — browser only, NO APK
on:
  push:
    branches: [OATHKEEPER-VISUAL-WORKBENCH]
    paths:
      - '.github/workflows/audit-workbench-buttons.yml'
      - 'Oathkeeper/web/test170-reference-buttons.css'
      - 'Oathkeeper/web/test170-button-states.js'
      - 'Oathkeeper/scripts/audit-test170-reference.cjs'
      - 'Oathkeeper/scripts/audit-workbench-button-text.cjs'
      - 'Oathkeeper/scripts/apply-test170-buttons.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oathkeeper-workbench-buttons
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Oathkeeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check authoritative source and icon files
        run: |
          node --check scripts/audit-workbench-button-text.cjs
          node --check web/test170-button-states.js
          npm ci
          node scripts/audit-workbench-source-alignment.mjs
          node --test tests/approved-icon-art.test.mjs
      - name: Extract validated frozen runtime WITHOUT building APK
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, shutil, stat, zipfile
          root=Path("..").resolve()
          chunks=sorted((root/".build142").glob("payload.part*.bin"))
          expected=[f"payload.part{i:02d}.bin" for i in range(10)]
          assert [p.name for p in chunks]==expected, "Archived approved web assets incomplete"
          archive=Path("/tmp/oathkeeper-workbench-original-web.zip")
          digest=hashlib.sha256()
          with archive.open("wb") as out:
              for chunk in chunks:
                  with chunk.open("rb") as reader:
                      while data:=reader.read(1024*1024):
                          out.write(data)
                          digest.update(data)
          assert digest.hexdigest()=="c83a657ab68b900b724b75c45b6d5d2256e69192a1d62e922279422fb0fb0b05"
          dist=Path("dist")
          if dist.exists():shutil.rmtree(dist)
          dist.mkdir()
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  assert info.filename.startswith("web-assets/")
                  relative=Path(info.filename).relative_to("web-assets")
                  assert not relative.is_absolute() and ".." not in relative.parts
                  assert not stat.S_ISLNK(info.external_attr>>16)
                  target=dist/relative
                  if info.is_dir():target.mkdir(parents=True,exist_ok=True)
                  elif relative!=Path("."):
                      target.parent.mkdir(parents=True,exist_ok=True)
                      with z.open(info) as src,target.open("wb") as dst:shutil.copyfileobj(src,dst)
          assert (dist/"index.html").is_file()
          PY
      - name: Reconstruct only approved visual reference assets
        run: |
          python -m pip install --disable-pip-version-check pillow cairosvg numpy
          python scripts/apply-ornate-buttons.py
          python scripts/apply-test-164.py
          python scripts/build-test169-reference-assets.py
          python scripts/patch-test169-approved-source.py
          python scripts/apply-test170-buttons.py
          python scripts/apply-test171-gameplay.py
          mkdir -p preview-output
          cp dist/art/exact-store/icons.webp preview-output/workbench-baked-icons-page.webp
          node --check dist/assets/main-FCw4hQ90.js
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit shared gold button font fit at 360, 393 and 412 CSS px
        run: |
          node scripts/audit-test170-reference.cjs
          node scripts/audit-workbench-button-text.cjs
      - name: Publish browser reports and screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OATHKEEPER-WORKBENCH-BUTTON-TEXT-PREVIEWS-NO-APK
          path: Oathkeeper/preview-output/*
          if-no-files-found: warn
          retention-days: 14
