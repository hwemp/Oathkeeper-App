name: Oathkeeper TEST-BRANCH-163 — pre-APK gem and UI audit
on:
  push:
    branches: [TEST-BRANCH-163]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    name: Check graphics, selectors and real UI before any APK build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Oathkeeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Oathkeeper/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check code, app integration, catalog and functional tests
        run: |
          npm ci
          npm run check
          npm run typecheck
          npm test
          npm run catalog
          npm run build
      - name: Verify retained approved store and dice web assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil
          import stat
          import zipfile

          root = Path('..').resolve()
          chunk_dir = root / '.build142'
          expected = [f'payload.part{i:02d}.bin' for i in range(10)]
          parts = sorted(chunk_dir.glob('payload.part*.bin'))
          if [p.name for p in parts] != expected:
              raise RuntimeError('Missing or unexpected Build 142 payload chunks')
          archive = Path('/tmp/oathkeeper-build144-web.zip')
          digest = hashlib.sha256()
          with archive.open('wb') as output:
              for part in parts:
                  with part.open('rb') as reader:
                      while True:
                          block = reader.read(1024 * 1024)
                          if not block:
                              break
                          digest.update(block)
                          output.write(block)
          expected_digest = 'c83a657ab68b900b724b75c45b6d5d2256e69192a1d62e922279422fb0fb0b05'
          if digest.hexdigest() != expected_digest:
              raise RuntimeError('Build 142 payload SHA256 mismatch')
          dist = Path('dist')
          if dist.exists():
              shutil.rmtree(dist)
          dist.mkdir()
          with zipfile.ZipFile(archive) as source:
              for entry in source.infolist():
                  if not entry.filename.startswith('web-assets/'):
                      raise RuntimeError(f'Unexpected archive entry: {entry.filename}')
                  relative = Path(entry.filename).relative_to('web-assets')
                  if relative.is_absolute() or '..' in relative.parts:
                      raise RuntimeError(f'Unsafe archive entry: {entry.filename}')
                  if relative == Path('.'):
                      continue
                  mode = entry.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise RuntimeError(f'Symlink not allowed: {entry.filename}')
                  destination = dist / relative
                  if entry.is_dir():
                      destination.mkdir(parents=True, exist_ok=True)
                      continue
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with source.open(entry) as reader, destination.open('wb') as writer:
                      shutil.copyfileobj(reader, writer)
          must_exist = [
              'index.html',
              'art/exact-store/dice.webp',
              'art/exact-store/backgrounds.webp',
              'art/exact-store/icons.webp',
              'art/exact-store/roll/astral.webp',
              'art/exact-store/roll/dragonfire.webp',
          ]
          if any(not (dist / name).is_file() for name in must_exist):
              raise RuntimeError('Build 142 web assets are incomplete')
          print('Verified full ZIP SHA256 and installed Build 142 web assets')
          PY
      - name: Install high-fidelity SVG-to-WebP render dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Add ornate background-responsive gems to preserved Build 144 user interface
        run: |
          python scripts/apply-ornate-buttons.py
          test -s dist/ornate-buttons.css
          for svg in ornate-amethyst ornate-flourish-left ornate-flourish-right; do
            test -s "dist/art/${svg}.svg"
          done
          grep -Fq 'data-oathkeeper-test161="ornate-buttons"' dist/index.html
          grep -Fq 'data-oath-gem-theme-controller="true"' dist/index.html
          test -s dist/ornate-gem-theme.js
          for bg in moonlit-citadel ancient-ruins enchanted-forest dragons-crag shadow-marsh celestial-plains crystal-caverns elder-grove mystic-lake eternal-keep; do
            test -s "dist/art/store-backgrounds/${bg}.svg"
          done
          for svg in sapphire emerald ruby aquamarine citrine; do test -s "dist/art/ornate-${svg}.svg"; done
      - name: Validate button UI embellishment files
        run: node --test tests/ornate-buttons.test.mjs
      - name: Install headless browser for real UI inspection
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture real Build 144 screen navigation, premium 163 borders, original artwork, dice and background previews
        run: node scripts/audit-test-163.cjs
      - name: Upload audit screenshots and layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TEST-163-real-ui-audit
          path: Oathkeeper/preview-output/*
          if-no-files-found: ignore
          retention-days: 15
